    <h1>不同语言中鸟类的名字(8)</h1>
    <div class="meta-line">发表于 2025-08-13 · 原文：<a href="https://mp.weixin.qq.com/s/bMrFO1anfiNxK35cK7hA0Q" target="_blank">点击查看</a></div>
  </div>
  <div class="rich_media_content" id="js_content">
<section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img" data-imgfileid="100001946" data-src="../../images/194/00.png" data-type="png" src="../../images/194/00.png" type="block"/></section><p><span leaf="">红嘴蓝鹊和黄嘴蓝鹊的中英文可以说是完美对应，日语中，ジャク是鵲的音读，红嘴蓝鹊直接是“山鵲”，黄嘴则在前面加了キバシ。</span></p><section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img js_insertlocalimg" data-imgfileid="100001947" data-src="../../images/194/01.jpg" data-type="jpeg" src="../../images/194/01.jpg" type="block"/></section><p style="text-align: center;"><span leaf="">红嘴蓝鹊</span></p><p><span leaf="">“嘴”可以读くちばし或者はし，在“黄”(キ)后面，变成了浊音。</span></p><p><span leaf="">喜鹊、灰喜鹊这两种常见的鸟，在日语中也是很简短的名字，比如灰喜鹊就叫“尾長”(オナガ)。</span></p><section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img js_insertlocalimg" data-imgfileid="100001949" data-src="../../images/194/02.jpg" data-type="jpeg" src="../../images/194/02.jpg" type="block"/></section><p style="text-align: center;"><span leaf="">喜鹊</span></p><p><span leaf="">喜鹊的名字(カササギ)麻烦一些，资料上说，カサ是因为喜鹊的叫声像「カシャカシャ」，而サギ和韩语中表示“吵闹、烦人”的词发音很像，但是我能找到的韩语中시끄럽다，发音并不与サギ类似。搞不懂。</span></p><section><span leaf=""><br/></span></section><p style="display: none;"><mp-style-type data-value="3"></mp-style-type></p>
