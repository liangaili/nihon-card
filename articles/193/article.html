    <h1>不同语言中鸟类的名字(7)</h1>
    <div class="meta-line">发表于 2025-08-04 · 原文：<a href="https://mp.weixin.qq.com/s/u6n1XlpnhcT2Hk9qFI1NPg" target="_blank">点击查看</a></div>
  </div>
  <div class="rich_media_content" id="js_content">
<section><span leaf="">许多名字里叫“鸦”的，在分类上已经不是鸦属了。</span></section><section><span leaf="">达乌里寒鸦和寒鸦，是寒鸦属，日语中也都是マルガラス。</span></section><section><span leaf="">中文名中的达乌里，与我国少数民族之一的达斡(wo4)尔族，是有关联的。</span></section><section><span leaf=""><img class="rich_pages wxw-img" data-imgfileid="100001942" data-src="../../images/193/00.jpg" data-type="jpeg" data-w="1280" src="../../images/193/00.jpg" type="block"/></span></section><section><span leaf="">达乌里寒鸦喜欢成群活动，有时能见到数百只的集群，非常壮观。</span></section><section><span leaf="">鸟名中带Daurian的还有很多，但是只有达乌里寒鸦保留了音译，其他的几种：斑翅山鹑、北椋鸟、北红尾鸲。</span></section><section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img" data-imgfileid="100001940" data-src="../../images/193/01.png" data-type="png" data-w="691" src="../../images/193/01.png" type="block"/></section><section><span leaf="">松鸦在日语中叫カケス，取巣をかける的意思，星鸦难得地与中文是一致的。</span></section><section><span leaf="">红嘴山鸦和黄嘴山鸦，日语中少了一个“山”字，而英语中的Alpine，是指阿尔卑斯山。</span></section><p style="display: none;"><mp-style-type data-value="3"></mp-style-type></p>
