<section style="text-align: justify;text-indent: 2em;"><span style="font-size: var(--articleFontsize);letter-spacing: 0.034em;">最近突然</span><span style="font-size: var(--articleFontsize);letter-spacing: 0.034em;">开了一个xhs，名字叫“点点日语”。</span><br/></section><section style="text-align: justify;text-indent: 2em;"><span style="font-size: var(--articleFontsize);letter-spacing: 0.034em;">内容会取材于已经发表在本号上的内容，也会有一些不一样的东西。</span></section><section style="text-align: justify;text-indent: 2em;">公众号的一篇内容太多了，xhs的一篇会更精炼。</section><section style="text-align: justify;text-indent: 2em;">最近开始学习西班牙语，但日语的内容还是想继续做下去。</section><section style="text-align: justify;text-indent: 2em;">承蒙厚爱，如有兴趣，还请帮我关注、点赞。<br/></section><section style="text-align: justify;text-indent: 2em;">谢谢。</section><section style="text-align: justify;text-indent: 2em;"><span style="font-size: var(--articleFontsize);letter-spacing: 0.034em;"><br/></span></section><p style="text-align: center;"><img class="rich_pages wxw-img" data-galleryid="" data-src="../../images/186/00.png" data-type="png" data-w="590" src="../../images/186/00.png" style=""/></p><p><br/></p><p style="display: none;"><mp-style-type data-value="3"></mp-style-type></p>
